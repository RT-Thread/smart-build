schema_version: 1
kind: package
name: opencv
version: 4.6.0
versions:
  - 4.6.0
default_version: 4.6.0
type: library
description: OpenCV computer vision libraries
provides:
  - opencv4
requires_toolchain:
  - c
  - cxx
  - static-library
source:
  type: archive
  url: https://github.com/opencv/opencv/archive/4.6.0.tar.gz
  archive: opencv-4.6.0.tar.gz
  sha256: 1ec1cba65f9f20fe5a41fda1586e01c70ea0c9a6d7b67c9e13edf0cfe2239277
  strip_root: true
  local_files:
    - sbuild.py
    - patches/01_header.diff
    - patches/02_cpp.diff
  files:
    - CMakeLists.txt
    - modules/core/include/opencv2/core.hpp
build:
  python:
    script: sbuild.py
    outputs:
      - /usr/include/opencv4
      - /usr/lib/libopencv_core.a
      - /usr/lib/libopencv_imgcodecs.a
      - /usr/lib/libopencv_imgproc.a
      - /usr/lib/opencv4/3rdparty
    upstream_markers:
      - CMakeLists.txt
      - modules/core/include/opencv2/core.hpp
install:
  headers:
    - usr/include/opencv4
  libraries:
    - usr/lib/libopencv_core.a
    - usr/lib/libopencv_imgcodecs.a
    - usr/lib/libopencv_imgproc.a
    - usr/lib/opencv4/3rdparty
