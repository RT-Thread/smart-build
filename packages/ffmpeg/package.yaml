schema_version: 1
kind: package
name: ffmpeg
version: 5.1.3
versions:
  - 5.1.3
default_version: 5.1.3
type: executable
description: FFmpeg multimedia libraries and command-line tools
requires_toolchain:
  - c
  - cxx
  - static-library
source:
  type: archive
  url: https://ffmpeg.org/releases/ffmpeg-5.1.3.tar.bz2
  archive: ffmpeg-5.1.3.tar.bz2
  sha256: 5d5bef6a11f0c500588f9870ec965a30acc0d54d8b1e535da6554a32902d236d
  strip_root: true
  local_files:
    - sbuild.py
  files:
    - configure
    - fftools/ffmpeg.c
    - libavcodec/avcodec.h
build:
  python:
    script: sbuild.py
    outputs:
      - /usr/bin/ffmpeg
      - /usr/bin/ffprobe
      - /usr/include/libavcodec
      - /usr/include/libavdevice
      - /usr/include/libavfilter
      - /usr/include/libavformat
      - /usr/include/libavutil
      - /usr/include/libpostproc
      - /usr/include/libswresample
      - /usr/include/libswscale
      - /usr/lib/libavcodec.a
      - /usr/lib/libavdevice.a
      - /usr/lib/libavfilter.a
      - /usr/lib/libavformat.a
      - /usr/lib/libavutil.a
      - /usr/lib/libpostproc.a
      - /usr/lib/libswresample.a
      - /usr/lib/libswscale.a
    upstream_markers:
      - configure
      - fftools/ffmpeg.c
      - libavcodec/avcodec.h
install:
  path: /usr/bin/ffmpeg
smoke:
  command:
    - ffmpeg
    - -version
