schema_version: 1
kind: package
name: webclient
version: 0.1.0
type: executable
description: Independent RT-Thread SCons webclient example
requires_toolchain:
  - c
  - static-library
source:
  directory: packages/webclient/source
kconfig:
  mode: native
  source: source/Kconfig
  symbol: PACKAGE_WEBCLIENT
build:
  rtthread_scons:
    supported_linkage: [static]
    install_target: install
    outputs:
      - /bin/webclient
smoke:
  command:
    - /bin/webclient
  expected_stdout: "usage: webclient <url>\n"
