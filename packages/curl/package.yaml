schema_version: 1
kind: package
name: curl
version: 8.20.0
versions:
  - 8.20.0
default_version: 8.20.0
type: executable
description: curl command-line URL transfer tool
depends:
  - openssl
  - libz
selects:
  - openssl
  - zlib
requires_toolchain:
  - c
  - static-library
source:
  type: archive
  url: https://curl.se/download/curl-8.20.0.tar.xz
  archive: curl-8.20.0.tar.xz
  sha256: 63fe2dc148ba0ceae89922ef838f7e5c946272c2e78b7c59fab4b79d3ce2b896
  strip_root: true
  local_files:
    - sbuild.py
  files:
    - configure
    - lib/url.c
    - src/tool_main.c
build:
  python:
    script: sbuild.py
    outputs:
      - /usr/bin/curl
      - /usr/lib/libcurl.a
    upstream_markers:
      - configure
      - lib/url.c
      - src/tool_main.c
install:
  path: /usr/bin/curl
smoke:
  command:
    - curl
    - --version
