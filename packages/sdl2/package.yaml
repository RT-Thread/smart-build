schema_version: 1
kind: package
name: sdl2
version: 2.0.16
versions:
  - 2.0.16
default_version: 2.0.16
type: library
description: SDL2 multimedia and input abstraction library
provides:
  - SDL2
requires_toolchain:
  - c
  - static-library
source:
  type: archive
  url: https://www.libsdl.org/release/SDL2-2.0.16.tar.gz
  archive: SDL2-2.0.16.tar.gz
  sha256: 65be9ff6004034b5b2ce9927b5a4db1814930f169c4b2dae0a1e4697075f287b
  strip_root: true
  local_files:
    - sbuild.py
    - patches/01_adapt_smart.diff
  files:
    - configure.ac
    - include/SDL.h
build:
  python:
    script: sbuild.py
    outputs:
      - /usr/include/SDL2
      - /usr/lib/libSDL2.a
      - /usr/lib/libSDL2main.a
    upstream_markers:
      - configure.ac
      - include/SDL.h
install:
  headers:
    - usr/include/SDL2
  libraries:
    - usr/lib/libSDL2.a
    - usr/lib/libSDL2main.a
