toolchain:
  package: riscv64-linux-musleabi-gcc-latest
  target: riscv64-linux-musleabi
  prefix: riscv64-linux-musleabi-
  loader: ld-musl-riscv64-sf.so.1
qemu:
  binary: qemu-system-riscv64
  profile: virt-riscv64
  machine: virt
